services:
  - type: web
    name: omniskill-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false          # Set manually: your Supabase connection string
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates a secure random value
      - key: ADMIN_INVITE_CODE
        sync: false          # Set manually: your chosen invite code
      - key: SEED_ADMIN_EMAIL
        sync: false          # Set manually: admin@yourdomain.com
      - key: SEED_ADMIN_PASSWORD
        sync: false          # Set manually: strong password — admin created on first boot
      - key: FRONTEND_URL
        sync: false          # Set manually: https://your-app.vercel.app
      - key: CORS_ORIGINS
        sync: false          # Set manually: https://your-app.vercel.app
      - key: UPLOAD_DIR
        value: /tmp/uploads  # Writable on Render; resets on restart (acceptable for now)
